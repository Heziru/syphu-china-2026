" cy="20" r="12"/><circle cx="-12" cy="11" r="10"/></g><text x="847" y="613" font-size="21" fill="#9d5b4f" font-weight="400" text-anchor="start">Intracellular</text><text x="847" y="642" font-size="24" fill="#9d5b4f" font-weight="700" text-anchor="start">Elafin</text><path d="M1000 625 H1300 V759" fill="none" stroke="#b96354" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#coral)"/><text x="1360" y="557" font-size="23" fill="#9d5b4f" font-weight="700" text-anchor="middle">Release</text><text x="1360" y="588" font-size="19" fill="#9d5b4f" font-weight="400" text-anchor="middle">to be measured</text><text x="65" y="847" font-size="18" fill="#6c8395" font-weight="700" text-anchor="start">EXTRACELLULAR REFERENCE</text><path d="M69 907 C43 875 70 852 101 867 C128 842 154 868 143 890 C178 902 162 939 131 935 C93 962 57 944 69 907" fill="#8cb5d3" stroke="#466e93" stroke-width="3"/><text x="201" y="911" font-size="26" fill="#253f48" font-weight="600" text-anchor="start">Elastase  +  Elafin</text><path d="M465 901 H639" fill="none" stroke="#385a60" stroke-width="3" marker-end="url(#arrow)"/><path d="M639 920 H465" fill="none" stroke="#385a60" stroke-width="3" marker-end="url(#arrow)"/><rect x="672" y="874" width="285" height="62" rx="12" fill="#e8eef5" stroke="#94b0c3" stroke-width="2"/><text x="814.5" y="913.0" font-size="24" fill="#253f48" font-weight="600" text-anchor="middle">Reversible binding</text><path d="M974 905 H1085" fill="none" stroke="#385a60" stroke-width="3" marker-end="url(#arrow)"/><text x="1111" y="895" font-size="24" fill="#253f48" font-weight="600" text-anchor="start">Enzyme inhibition</text><text x="1111" y="925" font-size="18" fill="#657a7c" font-weight="400" text-anchor="start">purified-protein evidence</text><text x="70" y="987" font-size="18" fill="#566d74" font-weight="400" text-anchor="start">Solid: design / reference relation</text><path d="M423 981 H501" stroke="#385a60" stroke-width="3" stroke-dasharray="9 7"/><text x="519" y="987" font