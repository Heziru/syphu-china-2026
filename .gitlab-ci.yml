image: node:22

pages:
  stage: build
  variables:
    VITE_IGEM_CDN: "true"
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - .yarn-cache/
  before_script:
    - echo 'yarn-offline-mirror ".yarn-cache/"' >> .yarnrc
    - echo 'yarn-offline-mirror-pruning true' >> .yarnrc
    - yarn install --frozen-lockfile
  script:
    - yarn build
    - node scripts/package-igem.mjs
  pages:
    publish: .igem-pages
  artifacts:
    paths:
      - .igem-pages
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # No runners will run on branches other than main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
